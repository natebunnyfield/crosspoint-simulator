# List the Apple Developer account's signing certificates through the App
# Store Connect API, using the same ASC key the TestFlight workflow signs
# with. READ-ONLY: it changes nothing on the account.
#
# Exists because run 17 of TestFlight iOS (2026-09-05) hit "Your account has
# reached the maximum number of certificates": every hosted run had minted a
# fresh Apple Development certificate, and the portal is the only other place
# that lists them. The listing gives the ids, types, inferred creation dates
# and the profiles each certificate is in, which is enough to tell the Mac's
# own identities from the runner-minted strays before revoking anything by
# hand at developer.apple.com.
#
# The key never reaches the log: it is written to a file under RUNNER_TEMP,
# read by the script, removed in an always() step, and the JWT it signs is not
# printed either.

name: ASC certificates

on:
  workflow_dispatch:

env:
  ASC_KEY_ID: 92428LY4AJ
  ASC_ISSUER: 69a6de73-c01e-47e3-e053-5b8c7c11a4d1

jobs:
  certificates:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the ASC key secret
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::ASC_KEY_P8 is not set"; exit 1; }
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Install the JWT library
        run: python3 -m pip install --quiet pyjwt cryptography requests

      - name: List certificates
        run: |
          python3 - <<'PY'
          import datetime as dt, os, sys, time
          import jwt, requests
          key_id = os.environ["ASC_KEY_ID"]; issuer = os.environ["ASC_ISSUER"]
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "AuthKey.p8")).read()
          now = int(time.time())
          token = jwt.encode({"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          h = {"Authorization": "Bearer " + token}
          base = "https://api.appstoreconnect.apple.com/v1"

          def get_all(path, params):
              out, url = [], base + path
              while url:
                  r = requests.get(url, headers=h, params=params, timeout=60); params = None
                  if r.status_code != 200:
                      print(f"::error::GET {path} -> {r.status_code}: {r.text[:300]}"); sys.exit(1)
                  j = r.json(); out += j.get("data", []); url = (j.get("links") or {}).get("next")
              return out

          certs = get_all("/certificates", {"limit": 200, "sort": "certificateType"})
          profiles = get_all("/profiles", {"limit": 200, "include": "certificates",
                                           "fields[profiles]": "name,profileType,profileState,certificates"})
          used_by = {}
          for p in profiles:
              for c in ((p.get("relationships") or {}).get("certificates") or {}).get("data", []):
                  used_by.setdefault(c["id"], []).append(p["attributes"]["name"])

          def created(exp):
              # Apple certificates are valid for one year; creation is expiry minus that.
              try:
                  e = dt.datetime.fromisoformat(exp.replace("Z", "+00:00"))
                  return (e - dt.timedelta(days=365)).strftime("%Y-%m-%d %H:%M")
              except Exception:
                  return "?"

          print(f"{len(certs)} certificate(s) on the account, {len(profiles)} profile(s)\n")
          print(f"{'id':<12} {'type':<22} {'created (expiry-1y)':<20} {'expires':<12} {'serial':<34} name / profiles")
          key_fn = lambda c: (c["attributes"].get("certificateType", ""), c["attributes"].get("expirationDate", ""))
          for c in sorted(certs, key=key_fn):
              a = c["attributes"]
              exp = (a.get("expirationDate") or "")[:10]
              profs = ", ".join(used_by.get(c["id"], [])) or "(no profile)"
              print(f"{c['id']:<12} {a.get('certificateType',''):<22} {created(a.get('expirationDate','')):<20} "
                    f"{exp:<12} {a.get('serialNumber',''):<34} {a.get('displayName') or a.get('name','')}  [{profs}]")
          PY

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
