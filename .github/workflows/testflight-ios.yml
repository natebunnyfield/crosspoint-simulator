# Build, sign, and upload the iOS CrossPoint X3 to TestFlight from a hosted
# macOS runner — no Mac, no keychain, no .p12 exports.
#
# Mirrors ios/testflight.sh step-for-step with two deliberate differences:
#
#   - No desktop canary. The canary needs PlatformIO + an [env:simulator]
#     stanza injected into the firmware; in CI the iOS archive itself is the
#     compile test, and canary plumbing failures would read as false alarms.
#   - Signing is CLOUD signing: ExportOptions.plist already says
#     signingStyle=automatic, and `xcodebuild -allowProvisioningUpdates` with
#     an App Store Connect API key mints a cloud-managed distribution
#     certificate and App Store profile on the runner. The ONLY secret is the
#     .p8 (ASC_KEY_P8). Requires the API key to have App Manager or Admin
#     role; a Developer-role key fails at archive with a signing error.
#
#   - Licensed font sources come from a private repo. The firmware keeps
#     Edgar's TTFs in its gitignored lib/EpdFont/local_fonts/, so a hosted
#     runner has none; with LOCAL_FONTS_SSH_KEY (a read-only deploy key,
#     which ios/setup-local-fonts-repo.sh creates end to end) or
#     LOCAL_FONTS_TOKEN (a fine-grained PAT) set, local_fonts_repo is checked
#     out into that folder first. Without either, a seed list that names a
#     licensed family stops at Resolve seed families.
#
# Build number: max remote build-N tag + 1, floor 2 — build 1 was consumed by
# the ITMS-90683 rejection. On success the workflow pushes build-N so the next
# run (CI or ios/testflight.sh on the Mac) continues the sequence.

name: TestFlight iOS

on:
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: >-
          Repository to build the firmware from (owner/name). The pin and the
          generated source set must come from THIS repo's history — repo and
          pin travel together. Default is the user's fork, whose x3-main
          branch carries the custom firmware plus integrated features.
        default: natebunnyfield/crosspoint-reader
        required: false
      firmware_ref:
        description: >-
          Firmware ref to build within firmware_repo. Blank = the commit
          pinned in cmake/CrossPointSources.cmake, which is the only tree the
          generated source set is guaranteed to match. Passing a branch here
          usually also means regenerating the source set first.
        default: ""
        required: false
      marketing_version:
        description: CFBundleShortVersionString
        default: 0.1.0
        required: false
      build_number:
        description: CFBundleVersion override (blank = auto from build-N tags)
        default: ""
        required: false
      skip_upload:
        description: Stop after export + verify (no upload)
        type: boolean
        default: false
      seed_fonts:
        description: >-
          Families to build and bundle into the app; they seed the phone's
          fonts/ folder at launch. The default, `installed`, means every
          family in the firmware's sd-fonts.yaml installed_families, which is
          the only list ios/CMakeLists.txt accepts: it refuses a bundle
          missing any installed family (the app would believe in a font it
          does not carry) and one carrying a family the list does not name
          (docs/ios-app-size.md A1). A comma-separated list is honoured as
          typed; run 16 (2026-09-05), dispatched with six of the eight, died
          at Configure that way. Blank disables bundling, which the Mac's
          ios/testflight.sh refuses outright; it is kept for experiments.
        default: installed
        required: false
      local_fonts_repo:
        description: >-
          Private repository (owner/name) holding what the firmware keeps in
          its gitignored lib/EpdFont/local_fonts/ -- Edgar's four TTFs today.
          Checked out into that folder when one of two secrets is set:
          LOCAL_FONTS_SSH_KEY, a read-only deploy key on that repo, which
          ios/setup-local-fonts-repo.sh creates, installs and stores in one
          run on the Mac; or LOCAL_FONTS_TOKEN, a fine-grained PAT with
          contents:read. Without either, a licensed family in the seed list
          stops the run at Resolve seed families, before any Mac minutes are
          spent. The Mac's ios/testflight.sh never needs this; its tree is
          built from the local folder.
        default: natebunnyfield/crosspoint-local-fonts
        required: false

env:
  BUNDLE_ID: com.natebunnyfield.crosspoint.x3
  TEAM_ID: 887M8FR447
  ASC_KEY_ID: 92428LY4AJ
  ASC_ISSUER: 69a6de73-c01e-47e3-e053-5b8c7c11a4d1
  NTFY_TOPIC: crds-ios-natebunnyfield-9k3m2p7v

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # push the build-N tag after a successful upload
    steps:
      - name: Check for the ASC key secret
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Repository secret ASC_KEY_P8 is not set. Paste the contents of ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 into Settings > Secrets and variables > Actions > New repository secret, name ASC_KEY_P8."
            curl -s -m 10 \
              -H "Title: CrossPoint X3 CI needs one secret" \
              -H "Priority: 4" -H "Tags: warning" \
              -d "Add ASC_KEY_P8 (contents of AuthKey_${ASC_KEY_ID}.p8) to the crosspoint-simulator repo Actions secrets, then re-run the TestFlight iOS workflow." \
              "https://ntfy.sh/$NTFY_TOPIC" || true
            exit 1
          fi
          echo "secret present"

      - name: Check out simulator
        uses: actions/checkout@v4
        with:
          path: simulator
          fetch-depth: 0 # full history so build-N tags are visible

      - name: Resolve firmware ref
        id: fwref
        run: |
          REF="${{ inputs.firmware_ref }}"
          if [ -z "$REF" ]; then
            REF=$(sed -n 's/^set(CROSSPOINT_FIRMWARE_PIN "\(.*\)")$/\1/p' \
                  simulator/cmake/CrossPointSources.cmake)
            [ -n "$REF" ] || { echo "::error::no CROSSPOINT_FIRMWARE_PIN in the source set"; exit 1; }
            echo "using pinned firmware commit $REF"
          else
            echo "using explicit firmware ref $REF"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out firmware
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.firmware_repo || 'natebunnyfield/crosspoint-reader' }}
          ref: ${{ steps.fwref.outputs.ref }}
          path: firmware
          submodules: recursive

      - name: Generate firmware sources
        # The firmware generates sources via PlatformIO extra_scripts, so a
        # fresh checkout is incomplete: gen_i18n.py produces
        # lib/I18n/I18nStrings.cpp and build_html.py produces the
        # *.generated.h gzipped web assets that CrossPointWebServer.cpp
        # includes. CI runs no PlatformIO; both scripts support standalone
        # invocation. (git_branch.py, the third pre-script, only injects a
        # version define that the generated source set already carries.)
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml || \
            python3 -m pip install --quiet pyyaml
          cd firmware
          python3 scripts/gen_i18n.py
          python3 scripts/build_html.py

      - name: Provision header-only PlatformIO deps
        # The generated source set references .pio/libdeps include paths that a
        # desktop `pio run` would normally populate. CI never runs PlatformIO,
        # and ArduinoJson is header-only, so a pinned clone is sufficient.
        run: |
          DEST=firmware/.pio/libdeps/simulator_x3/ArduinoJson
          mkdir -p "$(dirname "$DEST")"
          git clone --depth 1 --branch v7.4.2 \
            https://github.com/bblanchon/ArduinoJson "$DEST"

      - name: Licensed font sources
        # `secrets` cannot be read in a step-level `if`, so which credential
        # exists goes through an output that the two checkouts below and the
        # resolver's error text consult. The deploy key wins when both are
        # set: it is the one ios/setup-local-fonts-repo.sh maintains.
        id: local_fonts
        env:
          LOCAL_FONTS_SSH_KEY: ${{ secrets.LOCAL_FONTS_SSH_KEY }}
          LOCAL_FONTS_TOKEN: ${{ secrets.LOCAL_FONTS_TOKEN }}
        run: |
          if [ -n "$LOCAL_FONTS_SSH_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
            echo "LOCAL_FONTS_SSH_KEY set: ${{ inputs.local_fonts_repo }} will supply lib/EpdFont/local_fonts/ over the deploy key"
          elif [ -n "$LOCAL_FONTS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "LOCAL_FONTS_TOKEN set: ${{ inputs.local_fonts_repo }} will supply lib/EpdFont/local_fonts/ over the PAT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "neither LOCAL_FONTS_SSH_KEY nor LOCAL_FONTS_TOKEN is set: licensed families cannot be built in this run"
          fi

      - name: Check out licensed font sources (deploy key)
        if: ${{ inputs.seed_fonts != '' && steps.local_fonts.outputs.mode == 'ssh' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.local_fonts_repo }}
          ssh-key: ${{ secrets.LOCAL_FONTS_SSH_KEY }}
          path: firmware/lib/EpdFont/local_fonts

      - name: Check out licensed font sources (token)
        if: ${{ inputs.seed_fonts != '' && steps.local_fonts.outputs.mode == 'token' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.local_fonts_repo }}
          token: ${{ secrets.LOCAL_FONTS_TOKEN }}
          path: firmware/lib/EpdFont/local_fonts

      - name: Resolve seed families
        # `installed` becomes the firmware's installed_families, the one list
        # Configure accepts. Then every family's sources are checked BEFORE a
        # minute is spent rendering: a licensed source that is not on disk
        # fails here, naming the family and the two ways out, rather than 60 s
        # into build-sd-fonts.py (run 15) or eight minutes later at Configure
        # (run 16). Downloaded sources (TeX Gyre, Noto fallbacks) are fetched
        # by build-sd-fonts.py itself and are not checked here.
        if: ${{ inputs.seed_fonts != '' }}
        id: seed
        env:
          SEED_FONTS: ${{ inputs.seed_fonts }}
          HAVE_LOCAL_FONTS: ${{ steps.local_fonts.outputs.present }}
          LOCAL_FONTS_REPO: ${{ inputs.local_fonts_repo }}
        run: |
          python3 - <<'PY'
          import os, sys
          import yaml
          root = os.path.join("firmware", "lib", "EpdFont")
          recipe = yaml.safe_load(open(os.path.join(root, "scripts", "sd-fonts.yaml"), encoding="utf-8"))
          families = {f["name"]: f for f in recipe.get("families", [])}
          asked = os.environ["SEED_FONTS"].strip()
          if asked == "installed":
              names = list(recipe.get("installed_families") or [])
              if not names:
                  print("::error::sd-fonts.yaml has no installed_families; nothing to bundle")
                  sys.exit(1)
          else:
              names = [n.strip() for n in asked.split(",") if n.strip()]
          unknown = [n for n in names if n not in families]
          if unknown:
              print("::error::not in sd-fonts.yaml families: " + ", ".join(unknown))
              sys.exit(1)
          missing = {}
          for n in names:
              for style, spec in (families[n].get("styles") or {}).items():
                  path = spec.get("path", "")
                  if path.startswith("local_fonts/") and not os.path.isfile(os.path.join(root, path)):
                      missing.setdefault(n, []).append(path)
          if missing:
              have = os.environ.get("HAVE_LOCAL_FONTS") == "true"
              repo = os.environ.get("LOCAL_FONTS_REPO", "")
              for n, paths in missing.items():
                  print(f"::error::{n}: licensed source(s) not on disk: " + ", ".join(paths))
              if have:
                  print(f"::error::{repo} was checked out into lib/EpdFont/local_fonts/ but does not carry the files above at those paths.")
              else:
                  print("::error::These live in the firmware's gitignored lib/EpdFont/local_fonts/. On the Mac, run ios/setup-local-fonts-repo.sh once: it creates the private repo "
                        + (repo or "named by local_fonts_repo") + ", mirrors that folder into it, and stores a read-only deploy key as the LOCAL_FONTS_SSH_KEY secret (a fine-grained PAT in LOCAL_FONTS_TOKEN also works). "
                        + "Or ship from the Mac instead: osascript ~/src/crosspoint-simulator/ios/deploy.applescript")
              sys.exit(1)
          joined = ",".join(names)
          print("seed families: " + joined)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("families=" + joined + "\n")
          PY

      - name: Build seed fonts
        # The resolved families are built from the firmware's sd-fonts.yaml
        # and handed to CMake, which bundles them under Resources/SeedFonts/;
        # ios/CrossPointFsPrep.cpp copies them into the phone's visible fonts/
        # root at launch. freetype-py ships macOS wheels with libfreetype
        # embedded, so no brew dependency.
        #
        # Both tiers, because the app renders at CROSSPOINT_IOS_RENDER_SCALE 2
        # (ios/CMakeLists.txt) and a family without its 2x set draws
        # 1x-replicated glyphs on the phone. build-sd-fonts.py writes 1x into
        # <Family>/ and 2x into <Family>/2x/, the layout validate_seed_fonts.py
        # checks at Configure.
        #
        # Configure still refuses a bundle that names a family outside
        # installed_families: build 126 shipped iA Writer Duo, Mono and
        # Quattro through this input — 16.2 MB compressed of bundle that no
        # reading or editor surface could reach (docs/ios-app-size.md A1).
        if: ${{ inputs.seed_fonts != '' }}
        run: |
          python3 -m pip install --quiet --break-system-packages \
            -r firmware/lib/EpdFont/scripts/requirements.txt || \
            python3 -m pip install --quiet \
              -r firmware/lib/EpdFont/scripts/requirements.txt
          for sc in 1 2; do
            python3 firmware/lib/EpdFont/scripts/build-sd-fonts.py \
              --only "${{ steps.seed.outputs.families }}" \
              --scale "$sc" \
              --output-dir "$RUNNER_TEMP/seed-fonts"
          done
          ls -laR "$RUNNER_TEMP/seed-fonts"

      - name: Install the ASC API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # altool ALSO searches ./private_keys relative to the working dir;
          # the home path above is the documented location.

      - name: Version
        id: version
        run: |
          cd simulator
          LAST=$(git tag --list 'build-*' | sed 's/^build-//' | sort -n | tail -1)
          # Build 1 was consumed by the ITMS-90683 rejection; never reuse it.
          AUTO=$(( ${LAST:-1} + 1 ))
          BUILD_NUMBER="${{ inputs.build_number }}"
          BUILD_NUMBER="${BUILD_NUMBER:-$AUTO}"
          MARKETING_VERSION="${{ inputs.marketing_version }}"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "version $MARKETING_VERSION build $BUILD_NUMBER (last tag: ${LAST:-none})"

      - name: Configure
        run: |
          SEED_ARG=""
          if [ -n "${{ inputs.seed_fonts }}" ]; then
            SEED_ARG="-DCROSSPOINT_IOS_SEED_FONTS_DIR=$RUNNER_TEMP/seed-fonts"
          fi
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCROSSPOINT_FIRMWARE_DIR="$GITHUB_WORKSPACE/firmware" \
            -DCROSSPOINT_BUILD_FIRMWARE=ON \
            -DCROSSPOINT_IOS_TEAM_ID="$TEAM_ID" \
            -DCROSSPOINT_IOS_MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            -DCROSSPOINT_IOS_BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
            $SEED_ARG \
            -S simulator

      - name: Archive
        run: |
          xcodebuild archive \
            -project build/crosspoint_simulator.xcodeproj \
            -scheme CrossPointX3 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CrossPointX3.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER" \
            2>&1 | tee archive.log | grep -E "error:|ARCHIVE" || true
          RC=${PIPESTATUS[0]}
          # Filter with tee+grep, not `tail -20`: run 5's compile diagnostics
          # scrolled past the tail window, leaving only WHICH TU failed. On
          # failure, print the diagnostic context from the full log.
          if [ "$RC" -ne 0 ]; then
            grep -B 2 -A 8 "error:" archive.log | head -120 || true
          fi
          exit "$RC"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/CrossPointX3.xcarchive \
            -exportOptionsPlist simulator/ios/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER" \
            | tail -10
          IPA=$(find build/export -maxdepth 1 -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa exported"; ls -la build/export; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          du -h "$IPA"

      - name: Verify purpose strings
        run: |
          # Build 1 bounced on ITMS-90683. Never upload a bundle that will again.
          DIR=$(mktemp -d)
          unzip -q "$IPA" 'Payload/*.app/Info.plist' -d "$DIR"
          PLIST=$(find "$DIR" -name Info.plist | head -1)
          MISSING=0
          for key in NSCameraUsageDescription NSBluetoothAlwaysUsageDescription NSBluetoothPeripheralUsageDescription; do
            VALUE=$(plutil -extract "$key" raw -o - "$PLIST" 2>/dev/null) && [ -n "$VALUE" ] \
              && echo "  $key ok" \
              || { echo "::error::$key missing from the IPA"; MISSING=1; }
          done
          [ "$MISSING" -eq 0 ]

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossPointX3-ipa
          path: build/export/*.ipa

      - name: Upload to App Store Connect
        if: ${{ !inputs.skip_upload }}
        run: |
          set +e
          OUT=$(xcrun altool --upload-app -f "$IPA" -t ios \
                  --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error::altool failed rc=$RC"
            echo "$OUT" | grep -q "90382" && echo "::error::Daily upload cap for ${{ steps.version.outputs.marketing_version }} — re-run with a bumped marketing_version."
            echo "$OUT" | grep -qi "Apple ID" && echo "::error::rc 19: app record missing for $BUNDLE_ID, or the developer agreement needs re-accepting."
            exit $RC
          fi

      - name: Tag the build
        if: ${{ !inputs.skip_upload }}
        run: |
          cd simulator
          git tag "build-${{ steps.version.outputs.build_number }}"
          git push origin "build-${{ steps.version.outputs.build_number }}"

      - name: Notify success
        if: ${{ success() && !inputs.skip_upload }}
        run: |
          curl -s -m 10 \
            -H "Title: CrossPoint X3 ${{ steps.version.outputs.marketing_version }} (${{ steps.version.outputs.build_number }}) uploaded" \
            -H "Priority: 4" -H "Tags: rocket" \
            -d "Uploaded from CI. TestFlight processing takes ~5-10 min, then it appears in the TestFlight app." \
            "https://ntfy.sh/$NTFY_TOPIC" || true

      - name: Notify failure
        if: ${{ failure() }}
        run: |
          curl -s -m 10 \
            -H "Title: CrossPoint X3 CI TestFlight run failed" \
            -H "Priority: 4" -H "Tags: warning" \
            -d "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
