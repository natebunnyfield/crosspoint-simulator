<title>Albo Light Serifs Fixed</title>
<style>
  :root{--ink:#1b1917;--soft:#5d574e;--ground:#f6f4ef;--rule:#ded8cc;--accent:#7b5430;--ok:#3d6a46;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ece8e0;--soft:#9a9288;--ground:#141312;--rule:#343029;--accent:#d4a26e;--ok:#80b289;}}
  :root[data-theme="dark"]{--ink:#ece8e0;--soft:#9a9288;--ground:#141312;--rule:#343029;--accent:#d4a26e;--ok:#80b289;}
  body{background:var(--ground);color:var(--ink);padding-block:30px 70px;padding-left:16px;padding-right:16px;font:16px/1.6 "Iowan Old Style",Palatino,Georgia,serif;}
  .wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:28px;}
  h1{font-size:27px;margin:0;font-weight:600;} h2{font-size:19px;margin:0;font-weight:600;padding-top:10px;border-top:2px solid var(--rule);}
  p{margin:0;max-width:66ch;} .lede{color:var(--soft);}
  figure{margin:0;display:flex;flex-direction:column;gap:6px;}
  figure img{display:block;width:100%;height:auto;image-rendering:pixelated;background:#fff;border:1px solid var(--rule);}
  figcaption{font:13px/1.45 ui-monospace,Menlo,monospace;color:var(--soft);}
  section{display:flex;flex-direction:column;gap:13px;} .scroll{overflow-x:auto;}
  table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;}
  th,td{text-align:right;padding:6px 14px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  th{font:600 11px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);}
  .ok{color:var(--ok);font-weight:700;}
</style>
<div class="wrap">
  <header>
    <h1>Albo Light Serifs Fixed</h1>
    <p class="lede">On the light-serif ladder, <em>"b wins"</em>: the ExtraLight 200&rsquo;s wedge is 0.75 of the 400&rsquo;s &mdash; 39 long, 78 deep, drop 13 &mdash; where it had scaled with the stem to 34 &times; 68. Each row: the 400 for reference, then the 200 before and after. Native pixels.</p>
  </header>
  <section><h2>The letters</h2>
    <figure><img src="nHl-200.png" alt="n H l: the 400, then the 200 before and after"><figcaption>n H l at 0.20 px/unit &mdash; the 400, the 200 before, the 200 after</figcaption></figure>
  </section>
  <section><h2>Runs</h2>
    <figure><img src="r200-runs.png" alt="roman 200 runs"><figcaption>13 px &times;8 and 40 px &times;2, lines alternate before / after</figcaption></figure>
  </section>
</div>
