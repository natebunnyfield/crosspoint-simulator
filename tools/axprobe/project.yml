name: AXProbe
options:
  bundleIdPrefix: com.natebunnyfield.axprobe
targets:
  AXProbeApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [AXProbeApp]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.natebunnyfield.axprobe.app
      GENERATE_INFOPLIST_FILE: YES
  AXProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources: [AXProbeUITests]
    dependencies:
      - target: AXProbeApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.natebunnyfield.axprobe.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: AXProbeApp
schemes:
  AXProbe:
    build:
      targets: {AXProbeApp: all, AXProbeUITests: all}
    test:
      targets: [AXProbeUITests]
